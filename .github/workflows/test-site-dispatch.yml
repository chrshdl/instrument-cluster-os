# TEMPORARY -- delete once the dispatch has been proven.
#
# Makes the identical call ci.yml's notify-site job makes, with the same
# secret, so SITE_DEPLOY_PAT can be verified without waiting for a real
# tag build. Manual trigger only: it cannot fire on its own.

name: TEMP verify site dispatch

on:
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start publish.yml in revokyte-site
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_PAT }}
        # REST, not `gh workflow run`: that resolves the default branch
        # over GraphQL, which fine-grained PATs cannot read
        # (repository.defaultBranchRef -> "Resource not accessible").
        # This endpoint takes the ref explicitly and needs only
        # Actions: write.
        run: |
          gh api -X POST \
            repos/chrshdl/revokyte-site/actions/workflows/publish.yml/dispatches \
            -f ref=main
