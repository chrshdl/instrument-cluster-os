# Unlike the Pi 4/5, the Pi 3 has no boot code in an onboard EEPROM: the ROM
# reads bootcode.bin off this partition, which then loads start.elf (the
# VideoCore firmware) and its fixup.dat memory map. Both mainstream Pi 3
# DTBs ship; the firmware picks one by board revision.
image boot.vfat {
  vfat {
    files = {
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/start.elf",
      "rpi-firmware/fixup.dat",
      "bcm2710-rpi-3-b.dtb",
      "bcm2710-rpi-3-b-plus.dtb",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/overlays",
      "u-boot.bin",
      "boot.scr",
      "wpa_supplicant-wlan0.conf"
    }
  }
  size = 64M
}

image data.ext4 {
  ext4 {
    label = "data"
  }
  size = 512M
}

image sdcard.img {
  hdimage {}

  # Redundant U-Boot environment in the raw gap before the first
  # partition (CONFIG_ENV_IS_IN_MMC + CONFIG_SYS_REDUNDAND_ENVIRONMENT;
  # /etc/fw_env.config mirrors these offsets). Both copies are seeded
  # with the same defaults; U-Boot alternates between them on saveenv
  # and falls back to the valid copy after an interrupted write.
  partition uboot-env-a {
    in-partition-table = "no"
    image = "uboot-env.bin"
    offset = 0x400000
  }

  partition uboot-env-b {
    in-partition-table = "no"
    image = "uboot-env.bin"
    offset = 0x404000
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    # Explicit: keep the first real partition clear of the env copies.
    offset = 8M
    image = "boot.vfat"
  }

  partition rootfs_A {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition rootfs_B {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
