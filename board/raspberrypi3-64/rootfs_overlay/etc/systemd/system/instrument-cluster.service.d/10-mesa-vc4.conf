# The app's packaged unit pins MESA_LOADER_DRIVER_OVERRIDE=v3d, which is right
# for the Pi 4/5 split-DRM layout but fatal here: VideoCore IV has no V3D, so
# there is no v3d_dri.so in the image (the defconfig builds Mesa's vc4 gallium
# driver only) and EGL initialisation fails outright.
#
# On this board the single vc4 DRM device does both KMS and rendering, so the
# loader would pick vc4_dri.so on its own — but the packaged unit's assignment
# has to be displaced by name, and a drop-in that states the driver is easier
# to reason about than one that clears the variable. systemd applies drop-ins
# after the main unit, and the last assignment to a given variable wins.
[Service]
Environment=MESA_LOADER_DRIVER_OVERRIDE=vc4
