[Unit]
# wait until persistent storage is actually mounted
Requires=data.mount
After=data.mount

[Service]
# ensure the directory exists on the mounted partition
# using '+' tells systemd to run this with full privileges even if User= is set
ExecStartPre=+/bin/mkdir -p /data/etc/ssh

# generate keys manually
ExecStartPre=+/bin/sh -c 'if [ ! -f /data/etc/ssh/ssh_host_rsa_key ]; then ssh-keygen -f /data/etc/ssh/ssh_host_rsa_key -N "" -t rsa; fi'
ExecStartPre=+/bin/sh -c 'if [ ! -f /data/etc/ssh/ssh_host_ecdsa_key ]; then ssh-keygen -f /data/etc/ssh/ssh_host_ecdsa_key -N "" -t ecdsa; fi'
ExecStartPre=+/bin/sh -c 'if [ ! -f /data/etc/ssh/ssh_host_ed25519_key ]; then ssh-keygen -f /data/etc/ssh/ssh_host_ed25519_key -N "" -t ed25519; fi'

# Initialize Machine ID if missing
ExecStartPre=+/bin/sh -c 'if [ ! -s /data/etc/machine-id ]; then systemd-machine-id-setup --root=/data; fi'