# Mesa disables its shader cache on the read-only rootfs ($HOME/.cache is
# unwritable) and recompiles every GL shader on every boot. Point it at the
# persistent /data partition instead (dir created by prepare-data-dirs.service);
# measured ~1.3s faster time-to-first-frame on the Pi 5.
# /data is only 512M — cap the cache well below Mesa's 1G default.
[Service]
Environment=MESA_SHADER_CACHE_DIR=/data/cache/mesa
Environment=MESA_SHADER_CACHE_MAX_SIZE=64M
