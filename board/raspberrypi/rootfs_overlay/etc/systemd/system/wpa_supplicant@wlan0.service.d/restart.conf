
# The supplicant races udev at boot: started at multi-user, it can come up
# before udev has created wlan0, fail once, and stay dead — the upstream
# template unit has no Restart=. The app heals this from userspace
# (ensure_supplicant in revokyte), but network recovery must not depend on
# the application: restart the instance until the interface exists.
[Service]
Restart=on-failure
RestartSec=2
